<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SelfSync — Premium Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0B0F19;--blue:#5B7FFF;--cyan:#00E5FF;--indigo:#6366f1;--green:#4ADE80;--white:#FFFFFF}

html,body{
  width:100%;height:100%;background:#05080F;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none
}

.frame{
  position:relative;width:100%;max-width:400px;aspect-ratio:9/16;
  background:var(--bg);border-radius:48px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.05),0 30px 80px rgba(0,0,0,0.6),0 10px 30px rgba(0,0,0,0.4);
  transform:translateZ(0)
}
@media(max-width:440px){.frame{max-width:100%;border-radius:0;box-shadow:none}}
@media(min-height:900px){.frame{max-height:95vh;width:auto;height:95vh}}

/* Ambient background */
.ambient{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient .g1{
  position:absolute;top:50%;left:50%;width:85%;height:85%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(91,127,255,0.07) 0%,rgba(0,229,255,0.03) 30%,transparent 70%);
  border-radius:50%;animation:pulse 5s ease-in-out infinite
}
.ambient .g2{
  position:absolute;top:20%;right:-10%;width:50%;height:50%;
  background:radial-gradient(circle,rgba(0,229,255,0.04) 0%,transparent 70%);
  border-radius:50%;animation:drift 10s ease-in-out infinite alternate
}
@keyframes pulse{0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes drift{0%{transform:translate(0,0);opacity:0.2}100%{transform:translate(-30px,40px);opacity:0.5}}

.grid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.02;
  background-image:linear-gradient(rgba(255,255,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.08) 1px,transparent 1px);
  background-size:32px 32px}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.5) 100%)}

#canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* ============================
   SCREEN 1: "Synchronizing Your Life..."
   ============================ */
.screen1-text{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3;text-align:center;pointer-events:none
}
.screen1-text .line1{
  font-size:26px;font-weight:300;letter-spacing:0.3em;text-transform:uppercase;
  color:rgba(255,255,255,0.35);margin-bottom:6px
}
.screen1-text .line2{
  font-size:30px;font-weight:700;letter-spacing:-0.5px;
  background:linear-gradient(135deg,rgba(255,255,255,0.9) 0%,rgba(255,255,255,0.6) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.screen1-text{opacity:0;transition:opacity 0.8s ease}
.screen1-text.show{opacity:1}
.screen1-text.hide{opacity:0;transition:opacity 0.5s ease}

/* ============================
   SCREEN 2: Four productivity nodes (left side) + connection lines
   ============================ */
.nodes-container{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3;width:220px;pointer-events:none
}
.node-item{
  display:flex;align-items:center;gap:14px;
  padding:8px 0;opacity:0;
  transform:translateX(-15px);
  transition:all 0.6s cubic-bezier(0.22,1,0.36,1)
}
.node-item.show{opacity:1;transform:translateX(0)}
.node-item.hide{opacity:0;transform:translateX(-20px);transition:all 0.4s ease}
.node-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 12px currentColor
}
.node-label{
  font-size:14px;font-weight:500;letter-spacing:0.02em;color:rgba(255,255,255,0.7)
}
.node-item .node-line{
  flex:1;height:1px;background:linear-gradient(90deg,currentColor 0%,transparent 100%);
  opacity:0.2
}

/* ============================
   SCREEN 3: Logo + Sync Ring
   ============================ */
.logo-wrapper{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.4);
  z-index:5;opacity:0;
  transition:all 0.8s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none
}
.logo-wrapper.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.logo-glass{
  position:relative;width:176px;height:176px;border-radius:44px;
  background:rgba(255,255,255,0.035);
  backdrop-filter:blur(50px) saturate(1.6);
  -webkit-backdrop-filter:blur(50px) saturate(1.6);
  border:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 40px rgba(99,102,241,0.12),0 0 120px rgba(99,102,241,0.06),inset 0 1px 0 rgba(255,255,255,0.10);
  overflow:hidden
}
.logo-glass::before{
  content:'';position:absolute;inset:0;border-radius:44px;
  background:linear-gradient(145deg,rgba(255,255,255,0.14) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.05) 100%);
  pointer-events:none;z-index:2
}
.logo-glass::after{
  content:'';position:absolute;top:-1.5px;left:-1.5px;right:-1.5px;bottom:-1.5px;
  border-radius:45px;
  background:linear-gradient(145deg,rgba(99,102,241,0.3),transparent 50%,rgba(0,229,255,0.2));
  z-index:-1;opacity:0.45;animation:borderGlow 4s ease-in-out infinite alternate
}
@keyframes borderGlow{0%{opacity:0.25}100%{opacity:0.65}}
.logo-glass .app-icon-img{
  width:140px;height:140px;position:relative;z-index:3;border-radius:28px;
  filter:drop-shadow(0 0 30px rgba(99,102,241,0.35));
  animation:iconGlow 4s ease-in-out infinite;object-fit:contain
}
@keyframes iconGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(99,102,241,0.3))}50%{filter:drop-shadow(0 0 45px rgba(99,102,241,0.5)) drop-shadow(0 0 70px rgba(0,229,255,0.2))}}

/* Sync Orbit */
.sync-ring{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:4;width:240px;height:240px;border-radius:50%;
  border:1.5px solid transparent;
  background:conic-gradient(from 0deg,transparent,rgba(99,102,241,0.3),rgba(91,127,255,0.5),rgba(0,229,255,0.6),rgba(91,127,255,0.4),transparent 70%,transparent)border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity 1s ease;animation:ringSpin 4s linear infinite;
  pointer-events:none
}
.sync-ring.show{opacity:1}
@keyframes ringSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ============================
   SCREEN 4: Final Logo + Text + Progress
   ============================ */
.final-text{
  position:absolute;top:calc(50% + 110px);left:50%;
  transform:translate(-50%,10px);z-index:6;text-align:center;
  opacity:0;transition:all 1.2s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none
}
.final-text.show{opacity:1;transform:translate(-50%,0)}
.final-text .title{
  font-size:40px;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(180deg,#FFFFFF 0%,rgba(255,255,255,0.65) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;line-height:1.1
}
.final-text .title .sync{
  background:linear-gradient(135deg,var(--indigo),var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.final-text .tagline{
  font-size:13px;font-weight:300;letter-spacing:0.3em;text-transform:uppercase;
  color:rgba(255,255,255,0.3);line-height:1.6;word-spacing:4px
}

/* Progress bar */
.progress-container{
  position:absolute;bottom:110px;left:50%;transform:translate(-50%,0);
  z-index:6;width:200px;text-align:center;
  opacity:0;transition:opacity 0.6s ease;pointer-events:none
}
.progress-container.show{opacity:1}
.progress-track{
  width:100%;height:2px;background:rgba(255,255,255,0.05);
  border-radius:1px;overflow:hidden;position:relative
}
.progress-fill{
  height:100%;width:0%;border-radius:1px;
  background:linear-gradient(90deg,var(--indigo),var(--blue),var(--cyan));
  position:relative
}
.progress-fill::after{
  content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,0.5)
}
.progress-pct{
  display:block;margin-top:10px;font-size:12px;font-weight:500;
  letter-spacing:0.06em;color:rgba(255,255,255,0.25);
  font-variant-numeric:tabular-nums
}

/* ============================
   Status bar, Home indicator
   ============================ */
.status-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:14px 28px;display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;opacity:0.4
}
.status-bar .time{font-size:15px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.02em}
.status-bar .icons{display:flex;gap:7px;align-items:center}
.status-bar .icons svg{opacity:0.35}
.home-indicator{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  z-index:20;width:134px;height:5px;border-radius:100px;
  background:rgba(255,255,255,0.08);pointer-events:none
}
</style>
</head>
<body>

<div class="frame" id="frame">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time" id="statusTime">9:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0.5" y="0.5" width="16" height="11" rx="2" stroke="rgba(255,255,255,0.4)"/>
        <rect x="2" y="2" width="4.5" height="8" rx="1" fill="rgba(255,255,255,0.35)"/>
        <rect x="7.5" y="2" width="3.5" height="8" rx="1" fill="rgba(255,255,255,0.2)"/>
        <rect x="12" y="2" width="2.5" height="8" rx="1" fill="rgba(255,255,255,0.1)"/>
      </svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2C10.2 2 12 3.8 12 6C12 8.2 10.2 11 8 13C5.8 11 4 8.2 4 6C4 3.8 5.8 2 8 2Z" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
        <circle cx="8" cy="6" r="2" fill="rgba(255,255,255,0.35)"/>
      </svg>
    </div>
  </div>

  <!-- Ambient -->
  <div class="ambient"><div class="g1"></div><div class="g2"></div></div>
  <div class="grid"></div>
  <div class="vignette"></div>

  <!-- Canvas -->
  <canvas id="canvas"></canvas>

  <!-- SCREEN 1: "Synchronizing Your Life..." -->
  <div class="screen1-text" id="screen1Text">
    <div class="line1">Synchronizing</div>
    <div class="line2">Your Life...</div>
  </div>

  <!-- SCREEN 2: 4 Productivity nodes (left) -->
  <div class="nodes-container" id="nodesContainer">
    <div class="node-item" data-delay="0">
      <div class="node-dot" style="color:var(--indigo);background:var(--indigo)"></div>
      <span class="node-label">Tasks</span>
      <div class="node-line" style="color:var(--indigo)"></div>
    </div>
    <div class="node-item" data-delay="1">
      <div class="node-dot" style="color:var(--cyan);background:var(--cyan)"></div>
      <span class="node-label">Notes</span>
      <div class="node-line" style="color:var(--cyan)"></div>
    </div>
    <div class="node-item" data-delay="2">
      <div class="node-dot" style="color:var(--blue);background:var(--blue)"></div>
      <span class="node-label">Goals</span>
      <div class="node-line" style="color:var(--blue)"></div>
    </div>
    <div class="node-item" data-delay="3">
      <div class="node-dot" style="color:var(--green);background:var(--green)"></div>
      <span class="node-label">Habits</span>
      <div class="node-line" style="color:var(--green)"></div>
    </div>
  </div>

  <!-- SCREEN 3: Sync Ring -->
  <div class="sync-ring" id="syncRing"></div>

  <!-- SCREEN 3 & 4: Logo -->
  <div class="logo-wrapper" id="logoWrapper">
    <div class="logo-glass">
      <img src="public/icons/app-icon.png" alt="SelfSync" class="app-icon-img" />
    </div>
  </div>

  <!-- SCREEN 4: Final Text -->
  <div class="final-text" id="finalText">
    <div class="title">Self<span class="sync">Sync</span></div>
    <div class="tagline">Organize. Focus. Grow.</div>
  </div>

  <!-- SCREEN 4: Progress -->
  <div class="progress-container" id="progressContainer">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-pct" id="progressText">0%</span>
  </div>

  <!-- Home Indicator -->
  <div class="home-indicator"></div>

</div>

<script>
(function(){
  'use strict'

  /* ===== Canvas Setup ===== */
  const canvas=document.getElementById('canvas')
  const ctx=canvas.getContext('2d')
  const frame=document.getElementById('frame')
  let W,H,cx,cy,DPR
  let particles=[], startTime=0, rafId=null

  /* ===== DOM Refs ===== */
  const screen1Text=document.getElementById('screen1Text')
  const nodeItems=document.querySelectorAll('.node-item')
  const logoWrapper=document.getElementById('logoWrapper')
  const syncRing=document.getElementById('syncRing')
  const finalText=document.getElementById('finalText')
  const progressContainer=document.getElementById('progressContainer')
  const progressFill=document.getElementById('progressFill')
  const progressText=document.getElementById('progressText')
  const statusTime=document.getElementById('statusTime')

  /* ===== Resize ===== */
  function resize(){
    const rect=frame.getBoundingClientRect()
    DPR=Math.min(window.devicePixelRatio||1,2)
    W=rect.width; H=rect.height
    canvas.width=W*DPR; canvas.height=H*DPR
    canvas.style.width=W+'px'; canvas.style.height=H+'px'
    ctx.scale(DPR,DPR)
    cx=W/2; cy=H/2
  }
  window.addEventListener('resize',resize)

  /* ===== Time ===== */
  function updateTime(){
    const d=new Date()
    statusTime.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')
  }
  updateTime(); setInterval(updateTime,30000)

  /* ===== Particles ===== */
  const COLORS={indigo:[99,102,241],blue:[91,127,255],cyan:[0,229,255],green:[16,185,129],white:[255,255,255]}
  function createParticle(i){
    const orb=i<8
    const a=Math.random()*Math.PI*2
    const d=orb?50+Math.random()*45:30+Math.random()*Math.min(W,H)*0.3
    const cs=orb?[COLORS.indigo,COLORS.blue,COLORS.cyan]:[COLORS.cyan,COLORS.white,COLORS.indigo,COLORS.blue]
    const c=cs[Math.floor(Math.random()*cs.length)]
    return {
      x:cx+Math.cos(a)*(orb?d*1.2:d),y:cy+Math.sin(a)*(orb?d*1.2:d),
      bx:cx+Math.cos(a)*d,by:cy+Math.sin(a)*d,
      sz:orb?0.5+Math.random()*1.2:0.6+Math.random()*2.5,
      op:orb?0.12+Math.random()*0.25:0.03+Math.random()*0.1,
      c,dx:(Math.random()-0.5)*0.1,dy:(Math.random()-0.5)*0.1,
      ph:Math.random()*Math.PI*2,orb,
      oa:a,od:d,os:0.05+Math.random()*0.15,pp:Math.random()*Math.PI*2
    }
  }
  function initParticles(){
    particles=[]
    for(let i=0;i<50;i++) particles.push(createParticle(i))
  }
  function updateParticles(time){
    const t=time*0.001
    for(const p of particles){
      if(p.orb){
        p.oa+=p.os*0.016
        const tx=cx+Math.cos(p.oa)*p.od,ty=cy+Math.sin(p.oa)*p.od
        p.x+=(tx-p.x)*0.025;p.y+=(ty-p.y)*0.025
        const br=1+Math.sin(t*1.2+p.ph)*0.2
        p.op=(0.12+Math.sin(t*1.8+p.ph)*0.08)*br
        p.sz=(0.5+Math.sin(t*2.5+p.pp)*0.3)*br
      }else{
        p.x+=Math.sin(t*0.8+p.ph)*p.dx;p.y+=Math.cos(t*0.9+p.ph)*p.dy
        if(Math.hypot(p.x-p.bx,p.y-p.by)>40){p.dx*=-1;p.dy*=-1}
        p.op=0.03+0.07*(0.5+0.5*Math.sin(t*1.2+p.ph))
      }
    }
  }
  function drawParticles(){
    for(const p of particles){
      if(p.op<=0.005)continue
      ctx.save();ctx.globalAlpha=p.op
      const[r,g,b]=p.c
      ctx.fillStyle=`rgb(${r},${g},${b})`
      ctx.shadowColor=`rgba(${r},${g},${b},0.25)`
      ctx.shadowBlur=p.sz*4
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();ctx.restore()
    }
  }

  /* ===== Connection lines from nodes to center (Screen 2) ===== */
  function drawLines(progress){
    if(progress<=0)return
    const nodes=[
      {x:cx-60,y:cy-45,color:COLORS.indigo},
      {x:cx-60,y:cy-15,color:COLORS.cyan},
      {x:cx-60,y:cy+15,color:COLORS.blue},
      {x:cx-60,y:cy+45,color:[74,222,128]}
    ]
    const e=Math.min(progress*1.5,1)
    const ease=t=>1-Math.pow(1-t,4)
    const ep=ease(e)

    for(const n of nodes){
      const ex=cx+(n.x-cx)*(1-ep)
      const ey=cy+(n.y-cy)*(1-ep)
      const [r,g,b]=n.color
      const a=Math.min(ep*2.5,0.6)*(1-Math.max(progress-0.75,0)*3)

      // Glow
      ctx.save();ctx.globalAlpha=a*0.3
      ctx.shadowColor=`rgba(${r},${g},${b},0.4)`;ctx.shadowBlur=15
      ctx.strokeStyle=`rgba(${r},${g},${b},0.15)`;ctx.lineWidth=2;ctx.lineCap='round'
      ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore()

      // Core
      ctx.save();ctx.globalAlpha=a
      ctx.shadowColor=`rgba(${r},${g},${b},0.5)`;ctx.shadowBlur=8
      ctx.strokeStyle=`rgba(${r+40},${g+40},${b+40},0.7)`;ctx.lineWidth=0.8;ctx.lineCap='round'
      ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore()
    }

    // Central glow point
    const gAlpha=Math.min(ep*3,0.8)*(1-Math.max(progress-0.85,0)*5)
    if(gAlpha>0.01){
      ctx.save();ctx.globalAlpha=gAlpha
      const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,20)
      grd.addColorStop(0,'rgba(255,255,255,0.4)')
      grd.addColorStop(0.3,'rgba(99,102,241,0.2)')
      grd.addColorStop(1,'rgba(99,102,241,0)')
      ctx.fillStyle=grd
      ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill()
      ctx.restore()
    }
  }

  /* ===== Screen 1: Center glow particle + ripple ===== */
  function drawCenterGlow(progress){
    if(progress<=0)return
    const p=Math.min(progress*2,1)
    const ep=Math.min(progress*1.2,1)

    // Expanding ripples
    for(let i=0;i<3;i++){
      const d=i*0.2
      const rp=Math.max(0,Math.min((p-d)/(1-d),1))
      if(rp<=0)continue
      const radius=rp*160
      const a=(1-rp)*0.15*(1-i*0.15)
      ctx.save();ctx.globalAlpha=a
      ctx.strokeStyle=`rgba(91,127,255,${0.15+(1-rp)*0.15})`
      ctx.lineWidth=1.2-rp*0.6
      ctx.shadowColor='rgba(91,127,255,0.1)';ctx.shadowBlur=12
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();ctx.restore()
    }

    // Central bright dot
    const dotA=Math.min(p*3,1)*(1-Math.max(ep-0.6,0)*2.5)
    if(dotA>0.01){
      ctx.save();ctx.globalAlpha=dotA
      const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,20)
      grd.addColorStop(0,'rgba(255,255,255,0.6)')
      grd.addColorStop(0.4,'rgba(91,127,255,0.25)')
      grd.addColorStop(1,'rgba(91,127,255,0)')
      ctx.fillStyle=grd
      ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill()
      ctx.restore()
    }
  }

  /* ===== Main Render ===== */
  function getP(elapsed,start,dur){return Math.max(0,Math.min((elapsed-start)/dur,1))}

  function render(time){
    if(!startTime)startTime=time
    const elapsed=(time-startTime)/1000

    ctx.clearRect(0,0,W,H)
    updateParticles(time)

    /* ===== ANIMATION TIMELINE =====
       Screen 1: 0.0s - 1.0s  "Synchronizing Your Life..." + glow
       Screen 2: 1.0s - 2.0s  Nodes appear with lines
       Screen 3: 2.0s - 3.0s  Energy converges → Logo + Sync ring
       Screen 4: 3.0s - 4.0s  Final logo + Text + Progress → 100%
    =========================================== */

    // Screen 1: Text + Center glow (0s - 1s)
    const s1=getP(elapsed,0,1.2)
    if(s1>0&&!screen1Text.classList.contains('show')&&!screen1Text.classList.contains('hide')){
      screen1Text.classList.add('show')
    }
    if(s1>0.85&&!screen1Text.classList.contains('hide')){
      screen1Text.classList.add('hide')
    }
    drawCenterGlow(s1)

    // Screen 2: Nodes + connection lines (1s - 2s)
    const s2=getP(elapsed,0.9,1.3)
    if(s2>0){
      const stagger=[0,0.1,0.2,0.3]
      nodeItems.forEach((n,i)=>{
        const np=Math.max(0,Math.min((s2-stagger[i])/(1-stagger[i]),1))
        if(np>0&&!n.classList.contains('show')){n.classList.add('show')}
        if(s2>0.85&&!n.classList.contains('hide')&&i===0){n.classList.add('hide')}
        if(s2>0.88&&!n.classList.contains('hide')&&i===1){n.classList.add('hide')}
        if(s2>0.91&&!n.classList.contains('hide')&&i===2){n.classList.add('hide')}
        if(s2>0.94&&!n.classList.contains('hide')&&i===3){n.classList.add('hide')}
      })
    }
    // Lines from nodes to center — drawn during screen 2 overlap
    const lineP=getP(elapsed,1.0,1.0)
    if(lineP>0)drawLines(lineP)

    // Screen 3: Logo appears + sync ring (2s - 3s)
    const s3=getP(elapsed,2.0,1.0)
    if(s3>0){
      if(!logoWrapper.classList.contains('show'))logoWrapper.classList.add('show')
      if(!syncRing.classList.contains('show'))syncRing.classList.add('show')
    }

    // Screen 4: Final text + progress (3s - 4s)
    const s4=getP(elapsed,3.0,1.2)
    if(s4>0.2&&!finalText.classList.contains('show'))finalText.classList.add('show')
    if(s4>0.35&&!progressContainer.classList.contains('show'))progressContainer.classList.add('show')
    if(s4>0.35){
      const pv=Math.min((s4-0.35)/0.65,1)
      const ep=pv//linear
      progressFill.style.width=ep*100+'%'
      progressText.textContent=Math.round(ep*100)+'%'
    }

    drawParticles()
    rafId=requestAnimationFrame(render)
  }

  function init(){
    resize();initParticles()
    startTime=0
    if(rafId)cancelAnimationFrame(rafId)
    // Reset all
    screen1Text.classList.remove('show','hide')
    nodeItems.forEach(n=>n.classList.remove('show','hide'))
    logoWrapper.classList.remove('show')
    syncRing.classList.remove('show')
    finalText.classList.remove('show')
    progressContainer.classList.remove('show')
    progressFill.style.width='0%'
    progressText.textContent='0%'
    rafId=requestAnimationFrame(render)
  }

  setTimeout(init,200)
  window.addEventListener('resize',()=>{resize();initParticles()})
  frame.addEventListener('click',init)
})()
</script>
</body>
</html>
